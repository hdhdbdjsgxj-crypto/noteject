plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.noteject.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    ndkVersion '27.2.12479018'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            // Keep updates compatible with the APK built by the project-local toolchain.
            def existingDebugKey = rootProject.file('.toolchain/.android-user/debug.keystore')
            if (existingDebugKey.exists()) {
                storeFile existingDebugKey
                storePassword 'android'
                keyAlias 'AndroidDebugKey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'com.noteject.app'
        minSdk 26
        targetSdk 35
        versionCode 127
        versionName '1.10.53'
        ndk {
            def selectedAbi = project.findProperty('notejectAbi')
            if (selectedAbi) {
                if (!(selectedAbi in ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'])) throw new GradleException('Unsupported Noteject architecture')
                abiFilters selectedAbi
            } else abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static'; cppFlags '-std=c++17' }
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
}

dependencies {
    implementation 'com.artifex.mupdf:fitz:1.28.5'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
